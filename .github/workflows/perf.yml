name: perf

# ── THE MEASUREMENT LANE ────────────────────────────────────────────────────────────────────
#
# `bench-smoke` runs the criterion benches once each in test mode (`-- --test`): a smoke check that
# they still compile and run, and not a measurement. No timing is taken by it, and nothing in it
# can regress. A shared GitHub runner is far too noisy for an absolute timing to mean anything;
# the dispatched `bench-matrix` job below is the only place CI takes timings, and it reads them
# only as same-run ratios against `bytes::Bytes`.
#
# It is a workflow of its own because `[profile.bench]` (`opt-level = 3`, thin LTO, one codegen
# unit) builds the crate and criterion's whole dependency tree fully optimised, which is the
# slowest compile in the repository, and because a lane that measures is where a timing gate would
# go if the crate ever wants one (an instruction-count or same-run A/B comparison, as in tokora and
# smear), and it should not share a verdict with the merge gate.
#
# Pause it (Actions > perf > ... > Disable workflow) while you work. A crate with no benches
# deletes this workflow together with `benches/`, the `[[bench]]` entry and the `criterion`
# dev-dependency.
#
# `-Dwarnings` is not set, unlike `ci.yml`: a deprecation in criterion should not fail a smoke
# check, and lints are `ci.yml`'s business.

# Triggers, `paths-ignore` and the concurrency group are `ci.yml`'s; its comments say why. There is
# no `schedule`: a smoke run of unchanged code proves nothing new.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.txt'
  workflow_dispatch:
    inputs:
      base:
        description: 'Git ref to A/B against on the same runner (optional; empty = head only)'
        required: false
        default: ''
        type: string
      filter:
        description: 'Criterion filter regex (empty = every benchmark)'
        required: false
        default: ''
        type: string
      toolchain:
        description: 'Rust toolchain'
        required: false
        default: 'stable'
        type: string
      rounds:
        description: 'Rounds of the whole bench set per runner'
        required: false
        default: '2'
        type: string
      benches:
        description: 'Space-separated bench targets'
        required: false
        default: 'budgets clone lazy_vec stages storage'
        type: string
      control:
        description: "With base: run base, head and head again per round and target ('true' or 'false'), so that every A/B change has its own A/A band"
        required: false
        default: 'false'
        type: string
      codecheck:
        description: "Also run the code-check lane ('true' or 'false'): per-op counts and the code per target"
        required: false
        default: 'true'
        type: string

# A dispatched matrix run lasts hours: it has a group of its own, keyed on the run id, so that two
# dispatches never queue behind or cancel one another, and a push never cancels one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || format('{0}-{1}', github.ref, github.ref == 'refs/heads/main' && github.sha || '') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      # `--all-features` because cargo SKIPS a bench whose `required-features` are unmet instead of
      # failing it, and a skipped bench is a green job over a bench that never ran.
      - name: cargo bench --all-features -- --test
        run: cargo bench --all-features -- --test

  # ── bench-matrix: same-run ratios on five runner types ───────────────────────────────────────
  #
  # What it measures: the criterion bench targets named by `benches` (default: budgets, clone,
  # lazy_vec, stages, storage) with the
  # settings the handoff uses (`--sample-size 60 --warm-up-time 0.25 --measurement-time 0.85
  # --nresamples 10000`), `rounds` times, on Linux x86_64, Linux ARM64, Windows x86_64, Windows
  # ARM64 and macOS (Apple silicon). Dispatch only:
  #   gh workflow run perf.yml --ref <branch> -f base=<ref> -f filter='stages_native_stride' -f rounds=2
  #
  # How to read it: ABSOLUTE ns DO NOT COMPARE ACROSS RUNNERS (different CPUs, shared hosts, noisy
  # neighbours). Every table cell is `ns (ratio)`, the ratio being that handle's time over the
  # `bytes::Bytes` control measured in the SAME run, for the same operation and the same len/cap
  # (or backing); compare ratios across runners, and read a ratio near 1.00 as a tie. The
  # `max ratio` column is the worst operation of the row. Two rounds are summarised by their median;
  # the CSV keeps both. Round 2 runs the bench targets in reverse order, so that a drift of the
  # machine over the job does not land on the same target twice.
  #
  # The per-runner jobs only measure and upload; the `bench-summary` job below reads every
  # platform's artifact and writes one summary: a cross-platform overview, then each platform's
  # tables.
  #
  # With `base` set, the base ref is checked out beside the head and benched on the same runner in
  # the same job: per bench target and round, the base runs `--save-baseline base` and the head
  # runs `--baseline-lenient base` right after it, both under one `CRITERION_HOME`, so the change
  # columns are criterion's own base -> head comparison. The lenient form is what lets a head id
  # that the base lacks run without a comparison instead of failing the run. A bench target the base lacks (e.g. `stages`
  # before it existed) is skipped for the base and shows `—`.
  #
  # Timeout: the M1 run measured about 900 ids per round (220 each in budgets_native_stride and
  # budgets_padded_128, 338 in stages_native_stride, 114 in storage, plus clone and lazy_vec) at
  # ~1.4 s each (0.25 s warm-up + 0.85 s measurement + resampling): ~21 min per round, so two rounds
  # are ~45 min plus 10-15 min of thin-LTO compilation, and a base A/B doubles the benching to
  # ~1.7 h. Cold hosted ARM and Windows runners are slower, hence a job of 350 min (the hosted
  # ceiling is 360) and a Benchmark step of 320, so that an overrun still reaches the upload with
  # the rounds already done. Narrow `filter` or lower `rounds` for a quick run.
  #
  # With `base` and `control` set, each round and target runs base (`--save-baseline base`), head
  # (`head1`) and head AGAIN (`head2`), all in the same job, in fresh processes. The summarizer reads
  # the three baselines: A/B is base -> head1 and A/A is head1 -> head2, and an A/B change counts as
  # moved only when it leaves that cell's A/A band (`ci/bench/summarize.py` says the rule). Both heads
  # are the same build: the A/A band covers the noise of the process and the run, not the layout
  # noise of a second build. For that, dispatch with `base` set to the head's own commit: the two
  # builds are then identical code. A control run takes three bench runs per round instead of one or
  # two: pass `rounds` of five and a narrow `filter` and `benches`.
  #
  # Every artifact `timed-<runner>` holds the bench executables that ran, head and base, each with
  # its `.pdb` and `.map` when there are any, `sha256.txt`, `verified.txt` (that each executable on
  # disk after the run is the one copied before it), and the `llvm-objdump` listing of each, so that
  # every A/B carries the code of what it timed. It is a separate artifact so that `bench-summary`
  # does not download it.
  #
  # Windows: every multi-line step sets `shell: bash` explicitly (PowerShell breaks backslash
  # continuations), which also turns `pipefail` on, so no step pipes into `grep -q`. On Windows both
  # this job and `code-check` link with `-MAP` (RUSTFLAGS `-C link-arg=-MAP`: link.exe takes `-` as
  # `/`, and a leading `/` would be rewritten to a path by Git Bash) so that the `.map` names the
  # loops that the `.pdb` does not. A map only reads the link, but the flags are the same in both
  # jobs, so that the timed binaries are the ones `code-check` lists.
  bench-matrix:
    name: bench matrix (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    env:
      BASE_REF: ${{ inputs.base }}
      BENCH_FILTER: ${{ inputs.filter }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      ROUNDS: ${{ inputs.rounds }}
      BENCHES: ${{ inputs.benches }}
      CONTROL: ${{ inputs.control }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # windows-11-arm images may not ship rustup.
            curl --proto '=https' --tlsv1.2 -sSf -o rustup-init.exe https://win.rustup.rs/aarch64
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            # The Git Bash form for this step, the Windows form for the steps after it.
            export PATH="$HOME/.cargo/bin:$PATH"
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
      - name: Link maps on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C link-arg=-MAP" >> "$GITHUB_ENV"
      - name: Machine
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) cpu=$(lscpu | grep 'Model name' | cut -d: -f2- | sed 's/^ *//') ;;
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string) ;;
            Windows) cpu=$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' | tr -d '\r') ;;
          esac
          {
            echo "runner=${{ matrix.os }}"
            echo "os=$RUNNER_OS"
            echo "arch=$RUNNER_ARCH"
            echo "cpu=$cpu"
            echo "head=$(git rev-parse HEAD)"
            echo "base="
            rustc -vV
            cargo -V
          } > machine.txt
          cat machine.txt
      - name: Resolve dependencies once
        shell: bash
        run: cargo generate-lockfile
      - name: Check out the base
        if: ${{ inputs.base != '' }}
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "$BASE_REF"
          git -C "$RUNNER_TEMP/base-src" log --format='base %h %s' -1
          echo "base resolved to $(git -C "$RUNNER_TEMP/base-src" rev-parse HEAD)"
          sed "s/^base=.*/base=$(git -C "$RUNNER_TEMP/base-src" rev-parse HEAD)/" machine.txt > machine.tmp
          mv machine.tmp machine.txt
          # Both sides build against the same resolved dependencies.
          cp Cargo.lock "$RUNNER_TEMP/base-src/Cargo.lock"
      - name: Build the timed binaries
        shell: bash
        run: |
          # Build every bench target once, up front, and copy the executables that cargo names:
          # the Benchmark step below runs these same files (it is checked afterwards).
          source ci/bench/cargo_artifacts.sh
          mkdir -p timed
          : > timed/paths.txt
          : > timed/sha256.txt
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          heads=()
          for b in $BENCHES; do heads+=(--bench "$b"); done
          status=0
          cargo bench --locked --no-run "${heads[@]}" --message-format=json-render-diagnostics > timed/head.jsonl 2> timed/head-build.log || status=$?
          cat timed/head-build.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          for b in $BENCHES; do
            bin=$(timed_collect timed/head.jsonl "$PWD" "$b" timed/head)
            printf '%s\t%s\t%s\n' head "$b" "$bin" >> timed/paths.txt
            echo "$(sha256_of "timed/head/$b$ext")  head/$b$ext" >> timed/sha256.txt
          done
          if [ -n "$BASE_REF" ]; then
            bases=()
            for b in $BENCHES; do
              if [ -f "$RUNNER_TEMP/base-src/benches/$b.rs" ]; then bases+=(--bench "$b"); fi
            done
            if [ "${#bases[@]}" -gt 0 ]; then
              (cd "$RUNNER_TEMP/base-src" && cargo bench --locked --no-run "${bases[@]}" --message-format=json-render-diagnostics) > timed/base.jsonl 2> timed/base-build.log || status=$?
              cat timed/base-build.log
              if [ "$status" -ne 0 ]; then exit "$status"; fi
              for b in $BENCHES; do
                if [ ! -f "$RUNNER_TEMP/base-src/benches/$b.rs" ]; then continue; fi
                bin=$(timed_collect timed/base.jsonl "$RUNNER_TEMP/base-src" "$b" timed/base)
                printf '%s\t%s\t%s\n' base "$b" "$bin" >> timed/paths.txt
                echo "$(sha256_of "timed/base/$b$ext")  base/$b$ext" >> timed/sha256.txt
              done
            fi
          fi
          cat timed/sha256.txt
      - name: Benchmark
        shell: bash
        timeout-minutes: 320
        run: |
          export CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion"
          args=(--sample-size 60 --warm-up-time 0.25 --measurement-time 0.85 --nresamples 10000 --noplot)
          if [ -n "$BENCH_FILTER" ]; then args=("$BENCH_FILTER" "${args[@]}"); fi
          mkdir -p criterion-rounds
          for round in $(seq 1 "$ROUNDS"); do
            # A fresh criterion directory per round, so that `change/` can only ever be the
            # base -> head comparison and never round 2 against round 1.
            rm -rf "$CRITERION_HOME"
            # Even rounds run the targets in reverse order.
            order="$BENCHES"
            if [ $((round % 2)) -eq 0 ]; then
              order=""
              for b in $BENCHES; do order="$b $order"; done
            fi
            for b in $order; do
              if [ -n "$BASE_REF" ] && [ "$CONTROL" = true ]; then
                # Base, head, then head again, each under its own baseline name. The two heads are
                # adjacent in time, so that A/A sees the drift that A/B sees. A bench the base lacks
                # still gets its two heads.
                if [ -f "$RUNNER_TEMP/base-src/benches/$b.rs" ]; then
                  (cd "$RUNNER_TEMP/base-src" && cargo bench --locked --bench "$b" -- "${args[@]}" --save-baseline base)
                fi
                cargo bench --locked --bench "$b" -- "${args[@]}" --save-baseline head1
                cargo bench --locked --bench "$b" -- "${args[@]}" --save-baseline head2
                continue
              fi
              if [ -n "$BASE_REF" ] && [ -f "$RUNNER_TEMP/base-src/benches/$b.rs" ]; then
                (cd "$RUNNER_TEMP/base-src" && cargo bench --locked --bench "$b" -- "${args[@]}" --save-baseline base)
                compare=(--baseline-lenient base)
              else
                compare=()
              fi
              cargo bench --locked --bench "$b" -- "${args[@]}" "${compare[@]}"
            done
            cp -R "$CRITERION_HOME" "criterion-rounds/round$round"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: |
            criterion-rounds
            machine.txt
            Cargo.lock
          if-no-files-found: warn
      - name: Verify and list the timed binaries
        if: always()
        shell: bash
        run: |
          source ci/bench/cargo_artifacts.sh
          if [ ! -s timed/paths.txt ]; then
            echo "no timed binary was recorded"
            exit 0
          fi
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          if ! rustup component add llvm-tools; then
            echo "::warning::llvm-tools is unavailable for this host; no listings"
          fi
          tools=$(llvm_tools_dir)
          echo "llvm tools: $tools"
          : > timed/verified.txt
          # The loop reads paths.txt on its stdin, so every tool in it reads /dev/null.
          while IFS=$'\t' read -r side b bin; do
            copy="timed/$side/$b$ext"
            was=$(sha256_of "$copy")
            now=$(sha256_of "$bin")
            if [ "$was" = "$now" ]; then
              echo "same     $side/$b $was" >> timed/verified.txt
            else
              echo "CHANGED  $side/$b was $was now $now" >> timed/verified.txt
              echo "::warning::the $side $b executable changed after it was copied"
            fi
            if [ -f "$tools/llvm-objdump$ext" ] && [ -f "$tools/llvm-nm$ext" ]; then
              if ! "$tools/llvm-nm$ext" -C "$copy" < /dev/null | gzip -9 > "timed/$side/$b.nm.gz"; then
                echo "::warning::llvm-nm failed on $side/$b"
              fi
              if ! "$tools/llvm-objdump$ext" -d --demangle "$copy" < /dev/null | gzip -9 > "timed/$side/$b.dis.gz"; then
                echo "::warning::llvm-objdump failed on $side/$b"
              fi
            else
              echo "llvm-tools is missing under $tools; no listing for $side/$b" | tee -a timed/disasm-skipped.txt
            fi
          done < timed/paths.txt
          cat timed/verified.txt
          ls -l timed timed/head
      - name: Upload the timed binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timed-${{ matrix.os }}
          path: timed
          if-no-files-found: warn

  # ── bench-summary: one summary for every platform ────────────────────────────────────────────
  #
  # Runs on Linux, where `python3` is a real interpreter (on a Windows 11 image it can be the
  # Microsoft Store stub), after every matrix job, whether it passed, failed or timed out. A
  # platform with no artifact is named in the overview instead of being left out.
  bench-summary:
    name: bench summary
    needs: bench-matrix
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download every platform's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: artifacts
      - name: Summarize
        shell: bash
        run: |
          python3 -I ci/bench/summarize.py --platforms artifacts --csv bench-summary.csv \
            --expect ubuntu-latest ubuntu-24.04-arm windows-latest windows-11-arm macos-latest \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the combined CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-summary
          path: bench-summary.csv
          if-no-files-found: warn

  # ── code-check: counts and the code each target runs ─────────────────────────────────────────
  #
  # A clock A/B on a shared runner is too noisy to place a few nanoseconds (an A/A run moves the
  # per-id median 0.3-1.5%, the p90 3-14%, and macOS's median 18%), so this lane takes what does not
  # move: the instructions and the allocator calls of one operation, and the code that each target
  # actually runs. `benches/opcount.rs` is a driver that runs one case `k` times (`opcount <case>
  # <k>`, or `<case>@setup` for the setup alone), over the same handle types and operation bodies as
  # `benches/budgets.rs`.
  #
  # On all five runners it builds `budgets` and `opcount` in the bench profile and collects the
  # cfgs `build.rs` set for that build (`cfgs.txt`, from cargo's build-script-executed message), both
  # binaries (found by the `executable` field of cargo's JSON messages, never by a guessed path; on
  # Windows with their `.pdb`), their symbols (`llvm-nm -C`) and disassembly (`llvm-objdump -d --demangle`,
  # from rustup's `llvm-tools`), `rustc -vV` and `machine.txt`. On the two Linux runners it also
  # runs every case and its `@setup`, dropping and (`--forget`) forgetting what the loop makes,
  # under `valgrind --tool=callgrind` at k = 2000 and k = 4000;
  # `ci/bench/callgrind_ops.py` turns each pair into a per-iteration count, which cancels the
  # process's fixed cost, and prints the iteration less its setup per label against `bytes`.
  #
  # Dispatch only. `codecheck` defaults to 'true', so a dispatch that runs the matrix runs this too;
  # `-f codecheck=false` leaves it out:
  #   gh workflow run perf.yml --ref <branch> -f codecheck=true
  #
  # Windows: every multi-line step sets `shell: bash` (see bench-matrix), so no step pipes into
  # `grep -q`.
  code-check:
    name: code check (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.codecheck == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    env:
      TOOLCHAIN: ${{ inputs.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            # windows-11-arm images may not ship rustup.
            curl --proto '=https' --tlsv1.2 -sSf -o rustup-init.exe https://win.rustup.rs/aarch64
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            # The Git Bash form for this step, the Windows form for the steps after it.
            export PATH="$HOME/.cargo/bin:$PATH"
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$TOOLCHAIN"
          if ! rustup component add llvm-tools; then
            echo "::warning::llvm-tools is unavailable for this host; no symbols or disassembly"
          fi
      - name: Link maps on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C link-arg=-MAP" >> "$GITHUB_ENV"
      - name: Machine
        shell: bash
        run: |
          mkdir -p codecheck
          case "$RUNNER_OS" in
            Linux) cpu=$(lscpu | grep 'Model name' | cut -d: -f2- | sed 's/^ *//') ;;
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string) ;;
            Windows) cpu=$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' | tr -d '\r') ;;
          esac
          {
            echo "runner=${{ matrix.os }}"
            echo "os=$RUNNER_OS"
            echo "arch=$RUNNER_ARCH"
            echo "cpu=$cpu"
            echo "head=$(git rev-parse HEAD)"
            rustc -vV
            cargo -V
          } > codecheck/machine.txt
          rustc -vV > codecheck/rustc-vV.txt
          cat codecheck/machine.txt
      - name: Resolve dependencies once
        shell: bash
        run: |
          cargo generate-lockfile
          cp Cargo.lock codecheck/Cargo.lock
      # Cargo's layout of `target/` changes between releases (the build-dir layout moved the bench
      # binaries out of `target/release/deps`), so no step guesses a path: the JSON messages of this
      # build say where each executable is and what the build script set.
      - name: Build budgets and opcount
        shell: bash
        run: |
          status=0
          cargo bench --locked --no-run --bench budgets --bench opcount --message-format=json-render-diagnostics > codecheck/build.jsonl 2> codecheck/build.log || status=$?
          cat codecheck/build.log
          exit "$status"
      - name: Build-script cfgs
        shell: bash
        run: |
          source ci/bench/cargo_artifacts.sh
          # The `cfgs` of the package's build-script-executed message are what `build.rs` set with
          # `cargo:rustc-cfg=`. The package is the one that owns the `budgets` bench; its package_id
          # is not a name.
          pid=$(cargo_json codecheck/build.jsonl pid budgets)
          if [ -z "$pid" ]; then
            echo "no compiler-artifact message for budgets in codecheck/build.jsonl" >&2
            exit 1
          fi
          seen=0
          : > codecheck/cfgs.txt
          echo "# build-script-executed, $pid" >> codecheck/cfgs.txt
          lines=$(cargo_json codecheck/build.jsonl cfgs budgets)
          while IFS= read -r line; do
            case "$line" in
              msg) seen=1 ;;
              cfg:*) echo "cargo:rustc-cfg=${line#cfg:}" >> codecheck/cfgs.txt ;;
            esac
          done <<< "$lines"
          if [ "$seen" = 0 ]; then
            # Only if cargo sent no such message: read the build script's own output file.
            echo "(no build-script-executed message; the output files under target/ follow)" >> codecheck/cfgs.txt
            outputs=$(find target -path '*bytora*' -name output -type f || true)
            while IFS= read -r f; do
              if [ -z "$f" ]; then continue; fi
              echo "# $f" >> codecheck/cfgs.txt
              grep '^cargo:rustc-cfg=' "$f" >> codecheck/cfgs.txt || echo "(no cargo:rustc-cfg line)" >> codecheck/cfgs.txt
            done <<< "$outputs"
          fi
          cat codecheck/cfgs.txt
      - name: Binaries, symbols and disassembly
        shell: bash
        run: |
          source ci/bench/cargo_artifacts.sh
          ext=""
          sysroot=$(rustc --print sysroot)
          if [ "$RUNNER_OS" = Windows ]; then
            ext=".exe"
            sysroot=$(cygpath -u "$sysroot")
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          tools="$sysroot/lib/rustlib/$host/bin"
          if [ ! -f "$tools/llvm-objdump$ext" ]; then
            found=$(find "$sysroot/lib/rustlib" -name "llvm-objdump$ext" -type f 2>/dev/null | tail -n 1 || true)
            if [ -n "$found" ]; then tools=$(dirname "$found"); fi
          fi
          echo "llvm tools: $tools"
          for b in budgets opcount; do
            # `executable` of the compiler-artifact message for the bench target, as cargo wrote it.
            bin=$(cargo_json codecheck/build.jsonl exe "$b" | tail -n 1)
            if [ -z "$bin" ]; then
              echo "no executable for $b in codecheck/build.jsonl" >&2
              exit 1
            fi
            if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -u "$bin"); fi
            if [ ! -f "$bin" ]; then
              echo "$b: cargo named $bin, which is not a file; its directory holds:" >&2
              ls -l "$(dirname "$bin")" >&2
              exit 1
            fi
            echo "$b: $bin" >> codecheck/binaries.txt
            cp "$bin" "codecheck/$b$ext"
            # A Windows build leaves its `.pdb` beside the executable.
            for pdb in "${bin%.exe}.pdb" "$(dirname "$bin")/$b"*.pdb; do
              if [ -f "$pdb" ]; then
                cp "$pdb" "codecheck/$b.pdb"
                echo "$b pdb: $pdb" >> codecheck/binaries.txt
                break
              fi
            done
            # With `-MAP` (Windows), link.exe names the symbols the `.pdb` lacks, in a map file
            # named after its output, beside it or in its own directory.
            for map in "${bin%.exe}.map" "$(dirname "$bin")/$b"*.map "./$(basename "${bin%.exe}").map"; do
              if [ -f "$map" ]; then
                cp "$map" "codecheck/$b.map"
                echo "$b map: $map" >> codecheck/binaries.txt
                break
              fi
            done
            if [ -f "$tools/llvm-objdump$ext" ] && [ -f "$tools/llvm-nm$ext" ]; then
              if ! "$tools/llvm-nm$ext" -C "$bin" | gzip -9 > "codecheck/$b.nm.gz"; then
                echo "::warning::llvm-nm failed on $b"
              fi
              if ! "$tools/llvm-objdump$ext" -d --demangle "$bin" | gzip -9 > "codecheck/$b.dis.gz"; then
                echo "::warning::llvm-objdump failed on $b"
              fi
            else
              echo "llvm-tools is missing under $tools; no symbols or disassembly for $b" | tee -a codecheck/disasm-skipped.txt
            fi
          done
          cat codecheck/binaries.txt
          ls -l codecheck
      - name: Count with callgrind
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          valgrind --version
          opcount="$PWD/codecheck/opcount"
          mkdir -p codecheck/callgrind
          failed=0
          count() {
            local out=$1
            shift
            if ! valgrind --tool=callgrind --callgrind-out-file="$out" -q "$opcount" "$@" > /dev/null 2> codecheck/callgrind/stderr.txt; then
              failed=$((failed + 1))
              echo "::warning::callgrind run failed: $*"
              cat codecheck/callgrind/stderr.txt
              rm -f "$out"
            fi
          }
          # Every case and its setup alone, each at two values of k, so that the fixed cost of the
          # process cancels in the difference. Then the same with `--forget` (file name suffix
          # `@forget`), which leaks what the loop would drop, so that no drop is counted; the `drop`
          # op has no such variant.
          for name in $("$opcount" --list); do
            for variant in "$name" "$name@setup"; do
              for k in 2000 4000; do
                count "codecheck/callgrind/callgrind.$variant.$k.out" "$variant" "$k"
                case "$name" in
                  *-drop-*) ;;
                  *) count "codecheck/callgrind/callgrind.$variant@forget.$k.out" --forget "$variant" "$k" ;;
                esac
              done
            done
          done
          rm -f codecheck/callgrind/stderr.txt
          echo "failed runs: $failed"
          if [ "$failed" -ne 0 ]; then exit 1; fi
      - name: Per-op counts
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          status=0
          python3 -I ci/bench/callgrind_ops.py --dir codecheck/callgrind \
            --platform "${{ matrix.os }}" --csv codecheck/callgrind_ops.csv \
            > codecheck/callgrind_table.md || status=$?
          cat codecheck/callgrind_table.md
          if [ -d codecheck/callgrind ]; then
            tar czf codecheck/callgrind.tar.gz -C codecheck callgrind
            rm -rf codecheck/callgrind
          fi
          exit "$status"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codecheck-${{ matrix.os }}
          path: codecheck
          if-no-files-found: warn

  # ── codecheck-summary: the cfgs and the counts of every platform ─────────────────────────────
  #
  # Runs after every code-check job, whether it passed or not. A platform with no artifact is
  # named instead of being left out. Each platform's section is its machine, the `cargo:rustc-cfg=`
  # lines its build emitted, and (Linux only) the per-op count tables.
  codecheck-summary:
    name: code check summary
    needs: code-check
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.codecheck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: codecheck-*
          path: codecheck-artifacts
      - name: Summarize
        shell: bash
        run: |
          {
            echo "# code check"
            echo
            for runner in ubuntu-latest ubuntu-24.04-arm windows-latest windows-11-arm macos-latest; do
              dir="codecheck-artifacts/codecheck-$runner"
              echo "## $runner"
              echo
              if [ ! -d "$dir" ]; then
                echo "No artifact: the job did not run or did not upload."
                echo
                continue
              fi
              if [ -f "$dir/machine.txt" ]; then
                echo '```'
                grep -E '^(cpu|arch|os|head)=|^rustc |^host:|^release:' "$dir/machine.txt" || true
                echo '```'
                echo
              fi
              echo 'Build-script cfgs, from cfgs.txt:'
              echo
              echo '```'
              if [ -f "$dir/cfgs.txt" ]; then cat "$dir/cfgs.txt"; else echo "(missing)"; fi
              echo '```'
              echo
              if [ -f "$dir/disasm-skipped.txt" ]; then
                echo '```'
                cat "$dir/disasm-skipped.txt"
                echo '```'
                echo
              fi
              if [ -f "$dir/callgrind_table.md" ]; then
                cat "$dir/callgrind_table.md"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Combine the count CSVs
        shell: bash
        run: |
          first=1
          for f in codecheck-artifacts/*/callgrind_ops.csv; do
            if [ ! -f "$f" ]; then continue; fi
            if [ "$first" = 1 ]; then
              cat "$f" > callgrind_ops_all.csv
              first=0
            else
              tail -n +2 "$f" >> callgrind_ops_all.csv
            fi
          done
      - name: Upload the combined CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callgrind-summary
          path: callgrind_ops_all.csv
          if-no-files-found: warn
