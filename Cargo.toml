[package]
name = "smol-slice"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/smol-slice"
homepage = "https://github.com/al8n/smol-slice"
documentation = "https://docs.rs/smol-slice"
description = "Compact slice handles with inline storage"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
readme = "README.md"
keywords = ["slice", "inline", "no-std"]
categories = ["no-std", "no-std::no-alloc"]
exclude = ["/.github/", "/ci/", "/.codecov.yml", "/deny.toml"]

# The inline handles use only core with every feature combination.
[features]
default = ["std"]
std = []
alloc = []
# Shared ownership on targets without native pointer-width compare-and-swap.
extra-platforms = ["alloc", "dep:portable-atomic", "dep:portable-atomic-util"]

[dependencies]
typenum = { version = "1.20", default-features = false }
portable-atomic = { version = "1.5.1", optional = true, default-features = false }
portable-atomic-util = { version = "0.2.4", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
allocation-counter = "0.8.1"
bytes = "1"
criterion = "0.8"
smol-bytes = "=0.2.1"

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

# Without `bench = false`, `cargo bench` also builds the lib under libtest's bench harness, which
# is not what the `[[bench]]` target below, or `-- --test` in `perf.yml`, is for.
[lib]
bench = false

[[bench]]
path = "benches/clone.rs"
name = "clone"
harness = false

[[bench]]
path = "benches/lazy_vec.rs"
name = "lazy_vec"
harness = false

[[bench]]
path = "benches/budgets.rs"
name = "budgets"
harness = false

[[bench]]
path = "benches/stages.rs"
name = "stages"
harness = false

[[bench]]
path = "benches/storage.rs"
name = "storage"
harness = false

[[bench]]
path = "benches/opcount.rs"
name = "opcount"
harness = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
